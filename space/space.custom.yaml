# space.custom.yaml
# 用户自定义配置，使用librime patch语法覆盖space.yaml中的配置

patch:
  schema_id: ly_wubi_pinyin_14
  schema: TouchWB
  schema_dir: schemas/
  theme: 14key_wubi
  theme_dir: schemas/TouchWB/themes/
  font: default
  font_dir: fonts/
  symbol: default
  symbol_dir: symbols/
  emoticon: default
  emoticon_dir: emoticons/
  speech: volcengine
  speech_dir: speeches/
  sound_on: false
  sound_volume: 0
  sound_effect: default
  haptics_on: true
  haptics_volume: 1
  haptic: bouncy
  haptic_dir: haptics/
  global_keyboard_menu:
    - function_common_open_vip
  schema_use_theme:
    custom:
      ly_wubi_14: schemas/TouchWB/themes/14key_wubi
      ly_wubi_pinyin: schemas/TouchWB/themes/26key_wubi
      ly_wubi_pinyin_14: schemas/TouchWB/themes/14key_wubi
      wubi86_jidian_14: themes/handwriting_large
