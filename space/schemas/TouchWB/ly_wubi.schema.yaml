# encoding: utf-8
# author: Shawx、Autophotia
# date: 2026-05-15
# update_time: "2026-05-20"
# description: 纯五笔输入模式

schema:
  # 唯一标识符，用于区分不同的方案
  schema_id: ly_wubi
  # 方案显示名称
  name: "流萤五笔"
  # 版本号
  version: "v2.0"
  # 中文状态图标文件路径
  icon: "icons/CN.ico"
  # 英文状态图标文件路径
  ascii_icon: "icons/EN.ico"
  # 全角状态图标文件路径
  full_icon: "icons/full.ico"
  # 半角状态图标文件路径
  half_icon: "icons/half.ico"

  author:
    - Autophotia
    - https://github.com/Autophotia/TouchWubi
  description: |
    流萤
      流光一瞬，不羡永恒。
      萤火虽微，自照前程。
# 依赖的其他方案列表
  dependencies:
    - ly_pinyin        # 拼音词库（用于 z 键拼音词组反查）
    - wb_spelling   # 字根拆分数库（用于字根显示）

# 功能开关列表配置
switches:
  # 开关1：编码（五笔码）显示控制
  - name: new_hide_code
    reset: 1
    states: [ 隐编码, 显编码 ]
    comment: "显示/隐藏五笔字型编码（单字）"

  # 开关2：字根（部件拆分）显示控制
  - name: new_spelling
    reset: 1                # 默认值为1（显示部件拆分）
    states: [ 隐字根, 显字根 ]
    comment: "显示/隐藏汉字部件拆分（字根）"

  # 开关3：单字拼音显示控制
  - name: new_hide_pinyin
    reset: 1
    states: [ 隐拼音, 显拼音 ]
    comment: "显示/隐藏单字带声调拼音"

  # 开关4：字符集控制（GB2312）
  - name: GB2312
    reset: 0                # 默认值为0（扩展字符集）
    states: [ 扩展, 常用 ]
    comment: "常用字符集（GB2312）过滤"

  # 开关5：配对标点控制（pair_symbol）
  - name: pair_symbol
    reset: 1                # 默认值为1（开启配对）
    states: [ "单标点", "双标点" ]
    comment: "配对标点（括号、引号等自动成对）"

  # 开关6：Emoji表情显示控制（show_es）
  - name: show_es
    reset: 0                # 默认值为0（隐藏表情）
    states: [ 隐表情, 显表情 ]
    comment: "Emoji 表情"

  # 开关7：超级提示控制（super_tips）
  - name: super_tips
    reset: 0                # 默认值为0（关闭提示）
    states: [ 关超提, 开超提 ]
    comment: "超级提示"

  # 开关8：简繁转换控制（zh_trad）
  - name: zh_trad
    reset: 0                # 默认值为0（简体）
    states: [ 简体, 繁体 ]
    comment: "简繁转换"

  # 开关9：半/全角转换控制（full_shape）
  - name: full_shape
    reset: 0                # 默认值为0（半角字符）
    states: [ 半角, 全角 ]
    comment: "字符全角/半角"

  # 开关10：标点符号全半角控制（ascii_punct）
  - name: ascii_punct
    reset: 0                # 默认值为0（全角标点）
    states: [ 。，,．， ]
    comment: "标点符号全角/半角"
  # 自动调频控制（auto_freq）：打过的词自动往前排
  - name: auto_freq
    reset: 1                # 默认值为1（开启自动调频）
    states: [ 手调频, 自调频 ]
    comment: "自动调频（连续两次上屏同一个词才提前，达标后位置固定，不会因为多打几次又抢到第一；/txzq 清空记录）"


  # 智能联想控制（smart_assoc）：记住上屏过的词和顺序，逐级联想
  - name: smart_assoc
    reset: 1                # 默认值为1（开启方案联想）
    # ★★★★★ S95 更名：智能联想 / 官方联想⇒ **方案联想 / 应用联想**
    #   【用户 S95 原话】
    #   「prediction 是直接写进方案的联想总开关，而应用的联想补丁是
    #     补丁进的联想总开关。他们的作用是一样的。」
    #   ⇒ 按「谁的联想」命名，比按「开关叫什么」清楚得多：
    #     方案联想 = 本方案 smart_assoc 自己算的词（我们的词在前 + 应用词在后）
    #     应用联想 = 只用应用补丁那份 predictor 的词
    #   ⚠ 与 prediction（总联想开 / 总联想关）的区别：
    #     prediction是**总闸**（决定联想发不发生，可自由切换）
    #     smart_assoc 是**内容选择**（决定联想里谁的词在前，可自由切换）
    states: [ 应用联想, 方案联想 ]
    comment: "★ 方案联想开关。【方案联想】= 我们的联想词库生效（候选来自词库、点候选能连续续链），联想态下长按空格能唤起语音（S80 起不再冲突）。【应用联想】= 只用应用补丁那份官方 predictor 的词，我们的完全不干预。"

  - name: assoc_fixed
    reset: 1                # 默认值为1（带固定词库）
    states: [ 纯历史, 带词库 ]
    comment: "固定联想词库：开=冷启动也有候选；关=只联想自己打过的（万象那种「纯靠养」）"

# ASCII 模式切换按键绑定（消除 Missing ascii bindings 警告）
  # 自动连词造词（auto_coined）：连打即造临时词，用词组码召回转正；关=仅手动 ` 造词
  - name: auto_coined
    reset: 0                # 默认关（手动优先）
    states: [ 手造词, 自造词 ]
    comment: "自动连词造词：开启后连打相邻字词自动生成临时词，用其词组码召回并上屏即转正；关闭则仅保留手动 ` 造词"

  - name: prediction
    reset: 1
    states: [ 总联想关, 总联想开 ]
ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Caps_Lock: clear
    Control_L: noop
    Control_R: noop
    Eisu_toggle: clear
    Shift_L: commit_code
    Shift_R: commit_code

# 引擎配置块，定义输入法引擎的核心组件
engine:
  # 处理器列表（processors）：按顺序处理用户输入
  processors:
    - predictor
    - lua_processor@*calc_symbol_processor
    # ASCII模式切换处理器：处理中英文输入切换
    - ascii_composer
    # Lua处理器：自造词记录处理器（监控并记录用户自造词）
    - lua_processor@*smart_assoc*P     # 智能联想：★ 必须在 Submit_text / punctuator 之前
    - lua_processor@*Submit_text
    - lua_processor@*auto_coined*P     # 自动连词造词（auto_coined 开关控制，关时零开销）
    - lua_processor@*user_coined_cmd*P    # 自造词管理：/zcscN 接管序号数字键
    # Lua处理器：超级提示处理器
    - lua_processor@*super_tips
    # Lua处理器：超序列前移处理器（Super Sequence Processor）
    - lua_processor@*super_sequence*P
    # Lua处理器：配对标点处理器（必须在punctuator之前，处理配对引号和候选+标点上屏）
    - lua_processor@*pair_punct*processor
    # 标点处理器：处理标点符号输入（必须在speller之前，防止标点键进入编码栏）
    - punctuator
    # 识别器：识别特殊输入模式（如网址、邮箱、命令等）
    - recognizer
    # 按键绑定器：处理特殊按键绑定和快捷键
    - key_binder
    # 拼写处理器：处理拼音拼写和纠错
    - speller
    # 选择器：处理候选项选择操作（数字键、方向键等）
    - selector
    # 导航器：处理候选项导航操作（翻页等）
    - navigator
    # 快速编辑器：提供快速编辑功能（如删除、清空等）
    - express_editor

  # 过滤器列表（filters）：对候选项进行过滤和转换
  filters:
    # Lua过滤器：新拼写过滤器（处理字根显示）
    - lua_filter@*new_spelling
    # Lua过滤器：超序列过滤器（处理候选项排序）
    - lua_filter@*super_sequence*S         # 候选字词按词频自动排序（基于 quality 降序）
    - lua_filter@*super_sequence*F         # 候选字词快捷键手动调序（移动设备send数字调序）
    - lua_filter@*smart_assoc*F         # 智能联想：/lxqk 清空 /lxzt 状态（放 S+F 之后）
    - lua_filter@*user_coined_cmd*F       # 自造词管理：/zcscN 删除 /zccx 撤销 /zcqk 清空
    - lua_filter@*wubi_pinyin_filter       # 重码筛选（第五码拼音首字母筛选），放在S+F之后，在已排序候选基础上筛选
    # 简化器：执行通用简化和过滤操作
    - simplifier
    # Emoji转换过滤器：将文本转换为Emoji表情
    - simplifier@es_conversion
    # 唯一化器：去除重复的候选项
    - uniquifier

  # 分段器列表（segmentors）：将输入分段成不同的处理单元
  segmentors:
    # ASCII分段器：处理纯ASCII输入
    - ascii_segmentor
    # 匹配器：根据模式匹配输入分段（如日程命令、表达式等）
    - matcher
    # Affix分段器：自造词分段器（识别`键开头的输入）
    - affix_segmentor@mkst
    # ABC分段器：处理字母数字输入（拼音、五笔编码）
    - abc_segmentor
    # 标点分段器：处理标点符号输入
    - punct_segmentor
    # 兜底分段器：处理未被其他分段器匹配的输入
    - fallback_segmentor
    # Lua分段器：配对标点分段器
    - lua_segmentor@*pair_punct*segmentor

  # 翻译器列表（translators）：将输入转换为候选项
  translators:
    - predict_translator
    # Lua翻译器：日程翻译器（处理 /jt、/jq、/gz、/nl 等命令）- 放在最前面确保优先级最高
    - lua_translator@*smart_assoc*T     # 智能联想：在 predictor 空段上吐联想候选（放最前）
    - lua_translator@*schedule
    - lua_translator@*help_cmd                 # 帮助命令（/h、/help，列出全部命令）
    - lua_translator@*user_coined_cmd*T   # 自造词管理：/zctj 统计与倒序列表
    # 标点翻译器：翻译标点符号
    - punct_translator
    # 码表翻译器
    - table_translator
    # Lua`键引导的手动造词翻译器（读取文本文件，即时生效，全局变量）
    - lua_translator@user_coined_translator
    # 用户词典翻译器（自动学习用户词组）
    - table_translator@fixed
    # 临时自造词翻译器
    - table_translator@mkst
    # 脚本翻译器为wubi_pinyin_filter实现重码筛选提供支持（第五码拼音首字母筛选）
    - script_translator@wubi_prefix        # 为 wubi_pinyin_filter 提供第 5 码筛选支持（见文末 wubi_prefix 段说明）
    # 反查翻译器：支持拼音反查五笔编码
    - reverse_lookup_translator
    # Lua翻译器：计算器翻译器（处理 = 开头的数学表达式）
    - lua_translator@*calculator
    - lua_translator@*email_suffix_translator  # 显示常用邮箱后缀
    - lua_translator@*input_statistics         # 输入统计（/tj 等）
# ========================================
# ⌨️ 拼写规则配置（Speller）
# ========================================
speller:
  # 字母表：定义可用的字母字符（按字母逆序排列，包含反引号用于自造词）
  alphabet: zyxwvutsrqponmlkjihgfedcba`/@=
  # 首字母：定义可作为首字母的字符
  initials: zyxwvutsrqponmlkjihgfedcba`/@=
  # 分隔符：仅反引号，用于自造词引导
  delimiter: "`"
  # 最大编码长度（自造词或者混输模式需要较长的编码）
  max_code_length: 5                       # 5码拼音筛选特设
  auto_clear: max_length                   # 6码顶字上屏
  auto_select: false                       # 自动上屏开关
  auto_select_pattern: ^;.$|^\w{4}$        # 分号或4码自动上屏（仅上一句为true时生效）
  enable_completion: true                  # 启用编码补全：重码筛选时显示4码前缀匹配的候选
  # 拼写代数规则：定义输入转换规则
  algebra:
    # 规则1：删除匹配 "xx" 的输入（用于特殊触发）
    - erase/^xx$/
# ========================================
# 📚 翻译器配置（Translators）
# ========================================
translator:
  # 使用的字典文件名
  dictionary: wubi.extended
  # 数据库类型：使用表格数据库
  db_class: tabledb
  # 初始质量值：候选项的优先级权重（1000为最高优先级）
  initial_quality: 500
  # 对特定模式禁用用户词典：匹配以z开头的所有编码不记录到用户词典
  disable_user_dict_for_patterns:
    - "^z.*$"
  # 是否启用字符集过滤器（false=不启用，支持GBK扩展字符）
  enable_charset_filter: false
  # 是否启用整句输入（false=不启用，仅支持词组输入）
  enable_sentence: false
  # 是否启用用户词典（false=不启用，不记录用户输入）
  enable_user_dict: false
  # 是否启用编码器（false=不启用，不自动生成词组）
  enable_encoder: false
  # 是否编码提交历史（false=不启用，不学习用户习惯）
  encode_commit_history: false
  # 最大词组长度：最多支持4个字的词组
  max_phrase_length: 4
  # 是否启用联想（true=启用，支持前缀匹配，输入3码时显示4码候选）
  enable_completion: true
  # 候选词旁边“注释”（comment）部分显示样式配置
  comment_format:
    # 删除注释中的波浪号 ~
    - xform/~//
    # 将注释中的半角英文字母（a-z）全部转换为全角字母（ａ-ｚ）
    - 'xlit|abcdefghijklmnopqrstuvwxyz|ａｂｃｄｅｆｇｈｉｊｋｌｍｎｏｐｑｒｓｔｕｖｗｘｙｚ|'

# 拼音反查配置（z 键引导：输入 z+拼音，显示对应五笔编码）

# ================================================================
# 第五码筛选支持组件（script_translator@wubi_prefix）
# ----------------------------------------------------------------
# ⚠ 它不是拼音翻译器：读的是五笔字典 wubi.extended + 本方案的五笔棱镜，
#   全程没有任何拼音参与。只是借用了「按音节图切分输入」这套机制。
#
# 为什么非它不可（实测，详见 14键双键拼音候选缺失-排查报告.md）：
#   五笔码表最长 4 码。输入到第 5 码时，table_translator 既查不到精确码，
#   也查不到补全（补全的方向是「输入是编码的前缀」，而没有任何 5 字母编码
#   以 taned 开头）⇒ 一条候选都不出。
#   只有 script_translator 会把输入按词典音节图切开，产出「只吃掉前 1~4 码」
#   的候选（start=0、end=1~4）；wubi_pinyin_filter 靠这个 _end 判断
#   「第 5 码筛掉了哪些 4 码命中」（taned→物极必反、khlgg→中国/跨国/贵国）。
#
# ⚠ 不要删。删掉之后：
#   · 5 码筛选整体失效：taned 出「坦然地」、tanef/taneg/khlgg/khlgz/
#     wqvbh/wqvbn/fffff/nnnnn 全部变空；
#   · 连 4 码及以下的候选集合都会变（实测 tane 19→7、khlg 10→7、
#     wqvb 10→4、aawt 25→13、shua 9→4）—— 它早已是候选集合的一部分。
#
# 换成 table_translator 也不行：实测结果和「删掉」完全一致。
# Lua 自己也做不了：Lua 能拿到的 ReverseDb 是「字词→编码」方向
#   （wubi.extended.reverse.bin 查「彻骨」得 tame），而这里需要的是
#   「编码→字词」，Lua 侧根本没有这个索引。
#
# enable_completion: false 是刻意的（本组件也用不到补全），
#   704 个别名变体 + 268 行回归逐字验证：与 true 完全一致、0 差异。
# ================================================================
wubi_prefix:
  # 使用的字典文件名
  dictionary: wubi.extended
  # 数据库类型：使用表格数据库
  db_class: tabledb
  # 初始质量值：候选项的优先级权重（1000为最高优先级）
  initial_quality: 500
  # 对特定模式禁用用户词典：匹配以z开头的所有编码不记录到用户词典
  disable_user_dict_for_patterns:
    - "^z.*$"
  # 是否启用字符集过滤器（false=不启用，支持GBK扩展字符）
  enable_charset_filter: false
  # 是否启用整句输入（false=不启用，仅支持词组输入）
  enable_sentence: false
  # 是否启用用户词典（false=不启用，不记录用户输入）
  enable_user_dict: false
  # 是否启用编码器（false=不启用，不自动生成词组）
  enable_encoder: false
  # 是否编码提交历史（false=不启用，不学习用户习惯）
  encode_commit_history: false
  # 最大词组长度：最多支持4个字的词组
  max_phrase_length: 4
  # 是否启用联想（true=启用，支持前缀匹配，输入3码时显示4码候选）
  enable_completion: false               # 本组件不需要补全：704 变体验证与 true 逐字一致
  # 候选词旁边“注释”（comment）部分显示样式配置
  comment_format:
    # 删除注释中的波浪号 ~
    - xform/~//
    # 将注释中的半角英文字母（a-z）全部转换为全角字母（ａ-ｚ）
    - 'xlit|abcdefghijklmnopqrstuvwxyz|ａｂｃｄｅｆｇｈｉｊｋｌｍｎｏｐｑｒｓｔｕｖｗｘｙｚ|'

# 拼音反查配置（z 键引导：输入 z+拼音，显示对应五笔编码）
reverse_lookup:
  dictionary: ly_pinyin                # 反查字典：使用拼音字典
  prefix: "z"                       # 触发前缀：按 z 键进入拼音反查模式
  # suffix: "'"                     # 结束符（可选，用于明确结束反查输入）
  tips: "〈拼音〉"                  # 候选项前缀提示，标识当前为拼音反查结果
  preedit_format:                   # 输入显示格式转换（修正 ü 的显示）
    - xform/([nl])v/$1ü/            # n/l 后的 v → 显示为 ü（如 nv → nü）
    - xform/([nl])ue/$1üe/          # n/l 后的 ue → 显示为 üe（如 lve → lüe）
    - xform/([jqxy])v/$1u/          # j/q/x/y 后的 v → 显示为 u（如 jv → ju）

# 简繁转换器（支持简繁体转换）
simplifier:
  # OpenCC配置文件：s2t.json（简体转繁体）
  opencc_config: s2t.json
  # 控制开关名：zh_trad（对应前面定义的简繁开关）
  option_name: zh_trad

# Emoji 表情转换器（将文本转换为Emoji表情）
es_conversion:
  # OpenCC配置文件：es.json（Emoji转换规则）
  # 使用相对路径，Rime会在其工作目录下的opencc文件夹中查找
  opencc_config: es.json
  # 控制开关名：show_es（对应前面定义的Emoji显示开关）
  option_name: show_es
  # 提示：none（不显示提示信息）
  tips: none
  # 是否继承注释：false（不继承原文本的注释）
  inherit_comment: false

# Lua 反向数据库（用于字根和编码显示）
lua_reverse_db:
  # 拼写反查字典：wb_spelling（五笔拼写字典）
  spelling: wb_spelling
  # 编码反查字典：wb_spelling
  code: wb_spelling

# ========================================
# 🔍 识别器增强：支持短码快速上屏
# ========================================
recognizer:
  # 导入预设配置：default（使用默认的识别规则）
  import_preset: default
  # 识别模式列表
  patterns:
    # 表达式模式：匹配以=开头且至少包含一个字符的数学表达式（计算器翻译器）
    expression: "^=.+$"
    # 自造词模式：匹配`键引导的自造词输入（例如：aa`bb 表示两个字的自造词）
    mkst: "^[a-y]*`[a-y`]*$"
    # 标点符号模式：匹配以/开头的数字或字母（用于调取symbol.yaml中的符号）
    punct: "^/([0-9]0?|[A-Za-z]+)$"
    # 自造词管理命令：兜 /zcsc3 这类「字母+数字」串（纯字母命令仍走 punct）
    coin_cmd: "^/zc[a-z]+[0-9]+$"
    # 临时拼音功能：输入z键引导拼音反查（拼音翻译器自动切分音节）
    reverse_lookup: "^z[a-z]*$"
# 按键绑定配置（定义特殊按键和快捷键功能）
key_binder:
  # 从 default.yaml 继承通用按键绑定（tips_key/sequence/bindings）
  import_preset: default

tips:
  disabled_types: []

# 标点符号配置
punctuator:
  # 导入预设符号配置：symbols（使用 symbols.yaml 中定义的符号）
  import_preset: symbols

# 用户词典翻译器（自动学习用户词组，即时生效）
fixed:
  db_class: tabledb
  dictionary: wubi.extended
  disable_user_dict_for_patterns:
    - "^z.*$"
  enable_charset_filter: false
  enable_completion: false
  enable_encoder: false
  enable_sentence: false
  enable_user_dict: false
  encode_commit_history: false
  initial_quality: 510                      # 略高于主词典，确保用户词优先但不覆盖精确匹配
  max_phrase_length: 4

# 自造词临时翻译器（`键引导）
mkst:
  db_class: tabledb
  dictionary: wubi.extended
  disable_user_dict_for_patterns:
    - "^z.*$"
  enable_charset_filter: false
  enable_completion: false
  enable_encoder: false
  enable_sentence: true
  enable_user_dict: false
  encode_commit_history: false
  initial_quality: 450
  max_phrase_length: 4
  prefix: "`"
  tag: mkst
  tips: "〔自造词〕"

# 样式配置（输入法界面样式）
style:
  # 内联编辑：false（不使用内联编辑，显示在独立区域）
  inline_preedit: false
wubi_pinyin_filter:            # 该段显式配置优先级高于脚本检测
  use_key_pairs: false         # 按键对扩展：true = 14键模糊，false = 26键精确
  use_last_char: true          # 首末字筛选：true = 末字筛选，false = 首字筛选
  predict_cap_1: 3           # 1 码：一级简码之外最多带几条「前缀预测」
  predict_cap_2: 6           # 2 码：二级简码之外最多带几条（0 = 完全不预测）
  predict_cap_3: 5           # 3 码：三级简码之外最多带几条

# ================================================================
# predictor 本体（★ S100：从 .custom.yaml 固化进主方案）
# ----------------------------------------------------------------
# db: predict.db —— librime predict 插件的语言模型库，7.15MB，**不能删**：
#   沙箱实测（tools/sandbox_s100_predictdb.py）：缺了这个文件，
#   predictor 连「空段」都不建（17 次 → 0 次）⇒ 智能联想 + 长按空格语音全灭；
#   而放一个 0 字节的占位文件更糟 —— 引擎直接抛 C++ 异常（0xe06d7363）。
#   恢复办法：从任一 Sxx 包里取出 TouchWB/predict.db 放回本文件所在目录
#   （MD5 b2ca80c453087866a0db49aa0d97cf79，7,499,356 字节）。
# max_candidates / max_iterations —— 官方联想的质量参数，沿用 S79 取值。
#   ★ 2026-10-13：max_iterations 10→1（治「中国→长串」续写）；
#     max_candidates 10→1（降官方噪声，把候选栏让给本方案 smart_assoc 联想）。
#     10 会让 predictor 把「下一个词」贪心续写最多 10 轮，拼成一条长串
#     （如「中国」→「中国大陆的说明一切都好…」这种局部像话、全局胡言的 artifact，
#     是浅层 n-gram 的固有毛病）；1 只预测紧接的下一个词/短语，回到词级联想。
#     长串续写能力放弃（对五笔日常输入为净收益）。如需整句续写可调回 2~3。
# ================================================================
predictor:
  db: predict.db
  max_candidates: 1
  max_iterations: 1
