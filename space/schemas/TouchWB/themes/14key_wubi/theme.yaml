# default settings
# encoding: utf-8

style:
  __include: ./../public/style/default:/style
  default:
    keyboards: [ default, english, number, symbols, handwriting ] #竖屏（含横屏映射目标）
    keyboards_land: [ default_land, english_land, number_land, symbols_land, handwriting_land ] #横屏
  hmos:
    keyboards: [ default, english, number, symbols, handwriting ] #竖屏（含横屏映射目标）
    keyboards_land: [ default_land, english_land, number_land, symbols_land, handwriting_land ] #横屏
preset_styles:
  __include: ./../public/preset_styles/default:/preset_styles
  __patch:
    light_land/+:
      keyboards: [ default_land, english_land, number_land, symbols_land, handwriting_land ] #横屏
    dark_land/+:
      keyboards: [ default_land, english_land, number_land, symbols_land, handwriting_land ] #横屏
preset_candidates:
  __include: ./../public/preset_candidates/default:/preset_candidates
  default:
    margin: 3                           #候选项外边距5
    padding: 3                          #候选项内边距5
    spacing: 5                          #候选间距8
    candidate_view_height: 48           #候选区高度51
preset_fonts:
  __include: ./../public/preset_fonts/default:/preset_fonts
  default:
    candidate_text_size: 18             # 候选字号22
    comment_text_size: 12               # 逐码提示字号12
    key_text_size: 21                   # 键字号18
    key_upper_text_size: 10             # 符号字号8
preset_menu:
  __include: ./../public/preset_menu/default:/preset_menu
preset_color_schemes:
  __include: ./../public/preset_color_schemes/default:/preset_color_schemes
preset_keys:
  __include: ./../public/preset_keys/default:/preset_keys

  ### send
  send_dot: { icon: "textformat.svg", label: ".", send: "." }
  send_caret: { label: "^", send: "^" }
  commit_equal: { label: "=", commit: "=" }          # 长按「=」直插：= 在 speller.alphabet 内，裸字符会被当输入码进拼写流程
  # ★ 2026-11-26 全键盘长按档位重排（用户真机确认规则，第二版）：
  #   ★ 松手触发位 = 该键水平位置在长按面板上的投影，不是固定第 3 位：
  #     中间列键松手触发第 3 位；最左列键（q/a/z）触发第 1 位；最右列键（p/l）触发末位。
  #   ⇒ 排档原则：把该键要松手出的字符放到「松手位」上。
  #     注：26 键主题的中文键盘已于 2026-11-27 改为「松手出大写」（大小写互换），见 26key_wubi；
  #         本（14 键）主题的中文键盘仍为「松手出小写」，未动。
  #     26 键：普通键 [上滑字符, 大写, 小写, 下滑字符]，小写在第 3 位；
  #       q 键 [commit_q, Q, 一, 1]（首位小写）；p 键 [〇, P, 0, commit_p]（末位小写）；
  #       b 键 [B, commit_b, commit_halfat]：★ 2026-11-27 用户定稿 @ 移到末位（显示 B/b/@），
  #         中英文键盘统一；清空档已删，走 swipe_up；注意小写 b 在第 2 位（此键按用户指定特例，不按松手位）；
  #       Z 键 [commit_z, commit_Z, "`", "/"]：第 3 位反引号=松手触发造词引导，
  #         小写 z 保留在第 1 位显示（用户明确要求保留小写 z 的显示）。
  #     14 键双字母键：最左 qw/as 把小写 q/a 放第 1 位；最右 op 把小写 p 放末位；
  #       L 键把小写 l 放末位；Z 键同 26 键特例。
  #   上滑是功能键（撤销/剪切/复制等）的键：功能位留空，档位从大写起排。
  #   机制：半角 ASCII 字面量 = 发按键（过 Rime ProcessKey）；commit_* = 前端直插文本。
  #   直插的 ` 只往编辑器塞字符、不进编码栏 ⇒ mkst 分段器认不到 ⇒ 造词引导失效。
  #   S146 曾把原 [commit_z, commit_halfminus, "`", commit_Z] 改成 [commit_z, Z, commit_halfslash]，
  #   反引号被顶掉；2026-11-26 经多轮真机反馈定稿为上述排布。
  #   ★ B/op/b 键长按原带"清空"档（先是裸字面量，一度改成 clear_all_assoc 真动作）：
  #     2026-11-26 按用户决定整档删除——清空已由 swipe_up: clear_all_assoc 提供，
  #     长按不再重复放功能档，与其它字母键"长按只放字符"的规则一致；swipe_up 通道未动。
  # ★ 2026-11-27 英文键盘（ascii_mode）长按统一「小写 - 大写 - 标点」，边缘键单独微调：
  #   英文里点击本就是小写，长按松手取第 2 位 = 大写，是英文的正解。
  #   全部字母键默认 [commit_<小写>, <大写>, <标点>]：
  #     w→[commit_w, W, 2]、a→[commit_a, A, commit_equal]、s→[commit_s, S, ";"]、
  #     b→[commit_b, B, commit_halfat]（显示 b/B/@）。
  #   ★ 边缘键按各键松手位调整（用户 2026-11-27 指定）：
  #     q（最左，松手取第 1 位）= [Q, commit_q, 1]     大写 - 小写 - 数字
  #     p（最右，松手取末位）  = [commit_p, 0, P]      小写 - 数字 - 大写
  #     z                      = [commit_z, commit_Z, "/"]  小写 - 大写 - 斜杠（英文键盘删去反引号）
  #   反引号是中文造词引导（mkst 分段器识别），只在中文主键盘保留；英文键盘不需要。
  #   ★ 中文主键盘（ascii_mode: 0）仍沿用上面的中文排法，z 键保留反引号。
  send_halfslash: { label: "/", send: "/" }          # 原 commit_halfslash，输出不变
  send_halfpoundsign: { label: "#", send: "#" }      # 原 commit_halfpoundsign，输出不变
  send_asterisk: { label: "*", send: "*" }          # 英文键盘 x 下滑：进 punctuator 弹候选变体
  send_percent: { label: "%", send: "%" }           # 英文键盘 v 下滑：进 punctuator 弹候选变体

  ### 「清空」要忽略候选栏，一次清空到底
  #   keyboard.clearAll 在有 composition（联想段占位符 ›）时**只先清掉候选栏**，
  #   要再按一次才清正文 ⇒ 前置一次 {function_rime_clear}（candidate.clear，
  #   = 退格上滑「重输」，真机证实它连 Rime 侧 composition 一起清）。
  clear_all_assoc: { icon: "clean.svg", label: "清空", text: "{function_rime_clear}{function_keyboard_clearAll}" }

  ### 中文标点 —— ★ 必须走「发按键」，不能直接用 text/commit
  #  原因：text_ / commit_ / 全角字面量这几种写法是**前端直接往编辑器插文本**，
  #  不经过 Rime 的 ProcessKey ⇒ 我们的 smart_assoc processor 拦不到 ⇒
  #  联想词会被前端当成 composition 首候选一并顶上屏（如「测试沁？」）。
  #  改成 send 半角按键后：按键 → punctuator 查 symbols.yaml 转全角 → 上屏，
  #  而 smart_assoc 排在 punctuator 之前，能先把联想清掉。
  #  实测（沙箱）：联想态按 ? : ; ! 均只上屏全角标点、候选栏清空。
  send_question: { label: "？", send: "?" }        # punctuator: '?' -> ？
  send_colon: { label: "：", send: ":" }           # punctuator: ':' -> ：
  send_exclamation: { label: "！", send: "!" }     # punctuator: '!' -> ！
  send_semicolon: { label: "；", send: ";" }       # punctuator: ';' -> ；
  send_fullcomma: { label: "，", send: "," }       # punctuator: ',' -> ，
  send_fullperiod: { label: "。", send: "." }      # punctuator: '.' -> 。
  # 成对符号：text 前端直插一对 + {Left} 光标居中，一次出一对（不走 punctuator 的左右交替）。
  #   有未上屏候选/联想时先顶首候选上屏再插括号（全角顶字 / 半角直接），英文态无 composition 即直接上屏。
  #   不用 commit: —— Rime 的 commit 不解析 {Left}，光标会落在末尾。
  pair_fullquote: { label: "“”", text: "“”{Left}" }
  pair_bracket: { label: "（）", text: "（）{Left}" }

  # left: { icon: "arrow_left.svg", label: "⤆", send: Left }
  # right: { icon: "arrow_right.svg", label: "⤇", send: Right }
  # confirm: { send: Return, label: "确认", name: confirm }
  # next: { label: "换行", commit: "\\n" }

  ### eisu_toggle 竖屏
  eisu_toggle_schema_default: { icon: "ch_en.svg", label: "ABC", send: Eisu_toggle, select: .default, option: schema }
  eisu_toggle_123_number: { icon: "number.svg", label: "123", send: Eisu_toggle, select: number }
  eisu_toggle_ABC_english: { icon: "ch_en.svg", label: "中/英", send: Eisu_toggle, select: english}
  eisu_toggle_更多_dotSymbols: { icon: "symbols.svg", label: "更多", send: Eisu_toggle, select: .symbols }
  eisu_toggle_返回_default: { icon: "return_left_up.svg", label: 返回, send: Eisu_toggle, select: default }
  eisu_toggle_en_zh_default_schema_default: { icon: "en_ch.svg", label: "英/中", text: "{eisu_toggle_返回_default}{eisu_toggle_schema_default}" }
  eisu_toggle_符_symbols: { icon: "symbols.svg", label: "符", send: Eisu_toggle, select: symbols }
  eisu_toggle_default: { icon: "ch_en.svg", send: Eisu_toggle, select: default }
  eisu_toggle_status_bar_board: { icon: "switch_panel.svg", label: "状态栏", send: Eisu_toggle, select: _status_bar_board }
  # 手写键盘：切到下方 handwriting 布局（画板），点手写板底栏「写拼」切回 default，布局级可逆
  eisu_toggle_handwriting: { icon: "hand_draw.svg", label: "手写", send: Eisu_toggle, select: handwriting }
  ### eisu_toggle 横屏
  eisu_toggle_schema_default_land: { icon: "ch_en.svg", label: "ABC", send: Eisu_toggle, select: .default, option: schema }
  eisu_toggle_123_number_land: { icon: "number.svg", label: "123", send: Eisu_toggle, select: number_land }
  eisu_toggle_ABC_english_land: { icon: "ch_en.svg", label: "中/英", send: Eisu_toggle, select: english_land }
  eisu_toggle_返回_default_land: { icon: "return_left_up.svg", label: 返回, send: Eisu_toggle, select: default_land }
  eisu_toggle_en_zh_default_schema_default_land: { icon: "en_ch.svg", label: "英/中", text: "{eisu_toggle_返回_default_land}{eisu_toggle_schema_default_land}" }
  eisu_toggle_符_symbols_land: { icon: "symbols.svg", label: "符", send: Eisu_toggle, select: symbols_land }
  eisu_toggle_ABC_english_schema_easy_en_land: { icon: "keyboard_badge_globe.svg", label: "中/英", text: "{eisu_toggle_ABC_english_land}{eisu_toggle_schema_en}" }
  # 横屏手写键盘：select 字面指向 handwriting_land（横屏上滑直接进横屏手写，不依赖横屏映射）
  eisu_toggle_handwriting_land: { icon: "hand_draw.svg", label: "手写", send: Eisu_toggle, select: handwriting_land }
  ### text
  down_halfbracket: { label: "(", text: "(){Left}" }
  down_halfquotationmark: { label: "\"\"", text: "\"\"{Left}" }   # 英文双引号一对 "" + 光标居中
  down_halfsemiquotationmark: { label: "''", text: "''{Left}" }   # 英文单引号一对 '' + 光标居中
  down_angledbracket: { label: "<>", text: "<>{Left}" }   # 英文尖括号一对 <> + 光标居中（H 下滑）
  text_full_square_bracket_left: { label: "［］", text: "［］{Left}" }
  text_fullbracket_right_default_no_functional: { label: ")", text: "）{eisu_toggle_default}", functional: false }
  text_halfand_default_no_functional: { label: "&", text: "&{eisu_toggle_default}", functional: false }
  text_half_question_mark_default_no_functional: { label: "?", text: "?{eisu_toggle_default}", functional: false }
  text_half_point_default_no_functional: { label: "!", text: "!{eisu_toggle_default}", functional: false }
  text_half_comma_default_no_functional: { label: ",", text: ",{eisu_toggle_default}", functional: false }
  text_half_period_default_no_functional: { label: ".", text: ".{eisu_toggle_default}", functional: false }

  # 圆圈数字定义
  text_full_circled_1_default_no_functional: { label: "①", text: "①{eisu_toggle_default}", functional: false }
  text_full_circled_2_default_no_functional: { label: "②", text: "②{eisu_toggle_default}", functional: false }
  text_full_circled_3_default_no_functional: { label: "③", text: "③{eisu_toggle_default}", functional: false }
  text_full_circled_4_default_no_functional: { label: "④", text: "④{eisu_toggle_default}", functional: false }
  text_full_circled_5_default_no_functional: { label: "⑤", text: "⑤{eisu_toggle_default}", functional: false }
  text_full_circled_6_default_no_functional: { label: "⑥", text: "⑥{eisu_toggle_default}", functional: false }
  text_full_circled_7_default_no_functional: { label: "⑦", text: "⑦{eisu_toggle_default}", functional: false }
  text_full_circled_8_default_no_functional: { label: "⑧", text: "⑧{eisu_toggle_default}", functional: false }
  text_full_circled_9_default_no_functional: { label: "⑨", text: "⑨{eisu_toggle_default}", functional: false }
  text_full_circled_10_default_no_functional: { label: "⑩", text: "⑩{eisu_toggle_default}", functional: false }

  # 货币名称定义
  text_yuan_default: { label: "¥", text: "¥{eisu_toggle_default}", functional: false }
  text_dollar_default: { label: "$", text: "${eisu_toggle_default}" }
  text_euro_default: { label: "€", text: "€{eisu_toggle_default}" }
  text_pound_default: { label: "£", text: "£{eisu_toggle_default}" }
  text_ghanacedi_default: { label: "¢", text: "¢{eisu_toggle_default}" }
  text_baht_default: { label: "฿", text: "฿{eisu_toggle_default}" }
  text_rupee_default: { label: "₹", text: "₹{eisu_toggle_default}" }
  text_peso_default: { label: "₱", text: "₱{eisu_toggle_default}" }

  # 标点符号定义
  commit_fulldot: { label: "  。", commit: "。" }
  commit_bjgth: { label: "!", commit: "!" }
  commit_asterisk: { label: "*", commit: "*" }
  commit_percent: { label: "%", commit: "%" }
  commit_halfcolon: { label: ":", commit: ":" }
  commit_halfsemicolon: { label: ";", commit: ";" }
  send_halfat: { label: "@", send: "@" }              # 数字键盘上滑：send 进编码栏触发邮箱后缀候选


preset_keyboards:
  __include: ./../public/preset_keyboards/default:/preset_keyboards
  default:
    name: default
    ascii_mode: 0
    height: 46
    width: 10
    horizontal_gap: 6                    # 按键之间的水平间距（单位：dp）
    vertical_gap: 7                      # 按键之间的垂直间距（单位：dp，竖屏有效）
    vertical_gap_land: 4
    round_corner: 6
    key_text_offset_x: 0
    key_text_offset_y: 0                 #键文本y轴偏移4
    key_upper_text_offset_x: 0
    key_upper_text_offset_y: 1           #上标符号文本y轴1、2、3、下偏移
    key_down_text_offset_x: 0
    key_down_text_offset_y: 1            #下标符号文本y轴-1、-2、-3上偏移
  # 默认菜单 - 显示在输入法底部的快捷工具栏
    menu: { events: [
     eisu_toggle_emoji,                               # 表情
     eisu_toggle_clip_board,                          # 打开剪切板
     eisu_toggle_common_setting_switches,             # 通用开关宫格
     eisu_toggle_status_bar_board,                    # 方案内置状态开关切换
     eisu_toggle_schema_board                         # 键盘方案选择
    ] }
    keys:
  ### 第1行
      - { click: q, width: 20, label: Q   W, long_click: [commit_q, Q, commit_w, W, 1], swipe_left: q, swipe_right: w, swipe_down: 1, swipe_up: function_keyboard_cut }
      - { click: e, width: 20, label: E   R, long_click: [E, commit_e, commit_r, R, 2], swipe_left: e, swipe_right: r, swipe_down: 2, swipe_up: function_keyboard_copy }
      - { click: t, width: 20, label: T   Y, long_click: [T, commit_t, commit_y, Y, 3], swipe_left: t, swipe_right: y, swipe_down: 3, swipe_up: function_keyboard_paste }
      - { click: u, width: 20, label: U   I, long_click: [U, commit_u, commit_i, I, 4], swipe_left: u, swipe_right: i, swipe_down: 4, swipe_up: function_keyboard_selectAll }
      - { click: o, width: 20, label: O   P, long_click: [O, commit_o, P, 5, commit_p], swipe_left: o, swipe_right: p, swipe_down: 5, swipe_up: clear_all_assoc }
  ### 第2行
      - { click: a, width: 20, label: A   S, long_click: [commit_a, A, "%", commit_s, S, 6], swipe_left: a, swipe_right: s, swipe_down: 6, swipe_up: "%" }
      - { click: d, width: 20, label: D   F, long_click: [D, commit_d,  7, commit_f,  F, commit_halfat], swipe_left: d, swipe_right: f, swipe_down: 7, swipe_up: "@" }
      - { click: g, width: 20, label: G   H, long_click: ["#", G, commit_g, commit_h, H, 8], swipe_left: g, swipe_right: h, swipe_down: 8, swipe_up: "#" }
      - { click: j, width: 20, label: J   K, long_click: ["“”", J, commit_j, commit_k, K, 9], swipe_left: j, swipe_right: k, swipe_down: 9, swipe_up: pair_fullquote }
      # ★ pair_bracket：一次出一对（）+ 光标居中（text 直插 + function_rime_clear，不顶候选；
      #   机制见本文件上部定义段）。横竖屏 L 上滑统一为（）。
      - { click: l, width: 20, label: L, long_click: ["（）", L, 0, commit_l], swipe_down: 0, swipe_up: pair_bracket }
  ### 第3行
      - { click: shift, width: 10, has_menu: text_delimiter, name: shift, preview: false }
      - { click: z, width: 10, label: Z, long_click: [commit_z, commit_Z, "`", "/"], swipe_down: "/", swipe_up: function_keyboard_undo }
      - { click: x, width: 20, label: X   C, long_click: ["*", X, commit_x, commit_c, C, "!"], swipe_left: x, swipe_right: c, swipe_down: send_exclamation, swipe_up: "*" }
      - { click: v, width: 20, label: V   B, long_click: [":", V, commit_v, commit_b, B, "?"], swipe_left: v, swipe_right: b, swipe_down: send_question, swipe_up: send_colon }
      - { click: n, width: 20, label: N   M, long_click: [";", N, commit_n, commit_m, M, commit_equal], swipe_left: n, swipe_right: m, swipe_down: "=", swipe_up: send_semicolon }
      - { click: backspace, width: 20, name: backspace, preview: false, swipe_down: function_keyboard_redo, swipe_up: function_rime_clear}
  ### 第4行
      - { click: eisu_toggle_符_symbols, width: 14, name: symbol, preview: false }
      - { click: eisu_toggle_123_number, width: 12, has_menu: text_halfperiod, name: number, preview: false }
      - { click: send_fullcomma, width: 10, long_click: commit_half_comma, swipe_up: "-", swipe_down: commit_half_comma }
      - { click: space, width: 28, name: space, preview: false }
      - { click: send_fullperiod, width: 10, long_click: commit_halfperiod, swipe_up: "+", swipe_down: commit_halfperiod }
      - { click: eisu_toggle_ABC_english_schema_easy_en, width: 12, has_menu: text_halfcomma, name: english, swipe_up: eisu_toggle_handwriting, preview: false }
      - { click: return, width: 14, name: return, composing: confirm, long_click: [clear_all_assoc, function_keyboard_clearLeft, function_keyboard_clearRight,  function_keyboard_undo, function_keyboard_redo, next], rect_preview: true, preview: false}

  default_land:
    ascii_mode: 0
    height: 46
    width: 10
    horizontal_gap: 4                    # 按键之间的水平间距（单位：dp）
    vertical_gap: 7                      # 按键之间的垂直间距（单位：dp，竖屏有效）
    vertical_gap_land: 4
    round_corner: 6
    key_text_offset_x: 0
    key_text_offset_y: 0                 #键文本y轴偏移4
    key_upper_text_offset_x: 0
    key_upper_text_offset_y: 0           #上标符号文本y轴1、2、3、下偏移
    key_down_text_offset_y: 0            #下标符号文本y轴-1、-2、-3上偏移
  # 默认菜单 - 显示在输入法底部的快捷工具栏
    menu: { events: [
     eisu_toggle_clear_setting,                       # 清除文本相关操作
     eisu_toggle_更多_dotSymbols,                     # 更多符号
     eisu_toggle_custom_phrase_board,                 # 常用语
     eisu_toggle_cut_setting,                         # 剪切操作
     eisu_toggle_pasteboard_favorite_board,           # 剪切板收藏
     eisu_toggle_emoji,                               # 表情
