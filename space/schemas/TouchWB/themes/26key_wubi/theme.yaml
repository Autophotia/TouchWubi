# default settings
# encoding: utf-8

style:
  __include: ./../public/style/default:/style
  default:
    keyboards: [ default, english, number, symbols, handwriting ] #竖屏（含横屏映射目标）
    keyboards_land: [ default_land, english_land, number_land, symbols_land, handwriting_land ] #横屏
  hmos:
    keyboards: [ default, english, number, symbols, handwriting ] #竖屏（含横屏映射目标）
    keyboards_land: [ default_land, english_land, number_land, symbols_land, handwriting_land ] #横屏
preset_styles:
  __include: ./../public/preset_styles/default:/preset_styles
  __patch:
    light_land/+:
      keyboards: [ default_land, english_land, number_land, symbols_land, handwriting_land ] #横屏
    dark_land/+:
      keyboards: [ default_land, english_land, number_land, symbols_land, handwriting_land ] #横屏
preset_candidates:
  __include: ./../public/preset_candidates/default:/preset_candidates
  default:
    margin: 3                           #候选项外边距5
    padding: 3                          #候选项内边距5
    spacing: 5                          #候选间距8
    candidate_view_height: 48           #候选区高度51
preset_fonts:
  __include: ./../public/preset_fonts/default:/preset_fonts
  default:
    candidate_text_size: 18             # 候选字号22
    comment_text_size: 12               # 逐码提示字号12
    key_text_size: 21                   # 键字号18
    key_upper_text_size: 10             # 符号字号8
preset_menu:
  __include: ./../public/preset_menu/default:/preset_menu
preset_color_schemes:
  __include: ./../public/preset_color_schemes/default:/preset_color_schemes
preset_keys:
  __include: ./../public/preset_keys/default:/preset_keys

  ### send
  send_dot: { icon: "textformat.svg", label: ".", send: "." }
  send_caret: { label: "^", send: "^" }
  commit_equal: { label: "=", commit: "=" }          # 长按「=」直插：= 在 speller.alphabet 内，裸字符会被当输入码进拼写流程

  ### 26 键：符号的两条通道
  #   ★ 引导符 / 候选菜单式（= @ # / * % ~）走 send_* 按键通道（用户 11-15 定的口径）：
  #     有候选时由 pair_punct.lua 的 pool 分支顶「首候选 + 符号」上屏；
  #     无候选（空状态）时放行 punctuator ⇒ 弹候选变体菜单 + 触发
  #     = 计算器 / @ 邮箱后缀 / / 顿号等引导，* % ~ 则弹 symbols.yaml 的候选变体菜单。
  #     这是 S118 既有行为，**不要**改成直插。
  #     ⚠ ~ 的 half_shape 列表首项是全角 ～，按空格上屏 ～，半角 ~ 要翻到第 2 项；
  #       G 上滑 commit_fulltilde 仍是全角顶字（commit: 直插，不过 Lua），两者互不干扰。
  #   ★ 其余下滑半角（_ ? 及 ; : !、pair）要求「清候选直接上屏、不顶字」
  #     ⇒ 用下方 half_*_clear（text: "{function_rime_clear}X"），前置 candidate.clear。
  #   ★ 顶字的真正来源不是 punctuator，而是 lua/pair_punct.lua 按「字符」主动拦截：
  #     它挂在 punctuator 之前（见 ly_wubi*.schema.yaml 的 processors），
  #     pool_punct_set 收了 = * # @ ~ _ / 等引导符、direct_punct_map 收了 ? 等，
  #     打码中命中即 commit_text(首候选 .. 符号) + clear() + return 1 ⇒ 顶字上屏。
  #     （S118 规则，用户 2026-10-12 定；direct_punct_map 里 `#` 特意排除的注释亦载明此事）
  #   ⇒ send_* / 半角 ASCII 字面量 = 发按键 = 经过该 Lua：打码中按字符顶字，
  #     空状态放行 punctuator 出菜单 / 引导；
  #     text: / commit: = 前端直插 = 不过 Rime ProcessKey ⇒ 该 Lua 根本不运行。
  #   ⚠ 动作名不能与 preset_keys/default.yaml 同名（本地同名覆盖真机不生效），
  #     这也是 half_*_clear 另起新名、不复用 commit_halfunderline 等旧名的原因。
  send_halfslash: { label: "/", send: "/" }          # z 下滑：进 punctuator 弹候选变体（首项顿号 、）
  send_halfat: { label: "@", send: "@" }             # 符号键盘 / 长按用
  send_halfpoundsign: { label: "#", send: "#" }      # 符号键盘 / 长按用
  send_asterisk: { label: "*", send: "*" }           # x 下滑 / 符号键盘：进 punctuator 弹候选变体
  send_percent: { label: "%", send: "%" }            # v 下滑：进 punctuator 弹候选变体
  send_tilde: { label: "~", send: "~" }              # g 下滑：进 punctuator 弹 14 项候选变体（首项 ～）

  ### 中文数字（第 1 行上滑）：全角字面量没有 keysym，走不了按键
  #   ⇒ 退而求其次：前端直插，但前置 {function_rime_clear}（= candidate.clear，
  #     即退格上滑「重输」，真机证实它连 Rime 侧 composition 一起清）先清掉联想段，
  #     这样就不会把首候选顶上屏了。输出与以前完全一致。
  cnnum_1: { label: "一", text: "{function_rime_clear}一" }
  cnnum_2: { label: "二", text: "{function_rime_clear}二" }
  cnnum_3: { label: "三", text: "{function_rime_clear}三" }
  cnnum_4: { label: "四", text: "{function_rime_clear}四" }
  cnnum_5: { label: "五", text: "{function_rime_clear}五" }
  cnnum_6: { label: "六", text: "{function_rime_clear}六" }
  cnnum_7: { label: "七", text: "{function_rime_clear}七" }
  cnnum_8: { label: "八", text: "{function_rime_clear}八" }
  cnnum_9: { label: "九", text: "{function_rime_clear}九" }
  cnnum_0: { label: "〇", text: "{function_rime_clear}〇" }

  ### 「清空」要忽略候选栏，一次清空到底
  #   keyboard.clearAll 在有 composition（联想段占位符 ›）时**只先清掉候选栏**，
  #   要再按一次才清正文。前置一次 {function_rime_clear}（candidate.clear）把
  #   Rime 侧的 composition 一起清掉 ⇒ 按一下就是「忽略候选栏、直接清空」。
  clear_all_assoc: { icon: "clean.svg", label: "清空", text: "{function_rime_clear}{function_keyboard_clearAll}" }

  ### 中文标点 —— ★ 必须走「发按键」，不能直接用 text/commit
  #  原因：text_ / commit_ / 全角字面量这几种写法是**前端直接往编辑器插文本**，
  #  不经过 Rime 的 ProcessKey ⇒ smart_assoc processor 拦不到 ⇒
  #  联想词会被前端当成 composition 首候选一并顶上屏（如「测试沁？」）。
  #  改成 send 半角按键后：按键 → punctuator 查 symbols.yaml 转全角 → 上屏，
  #  而 smart_assoc 排在 punctuator 之前，能先把联想清掉。
  #  与 14key_wubi 完全同一套定义。
  send_semicolon: { label: "；", send: ";" }       # punctuator: ';' -> ；
  send_fullcomma: { label: "，", send: "," }       # punctuator: ',' -> ，
  send_fullperiod: { label: "。", send: "." }      # punctuator: '.' -> 。
  # ★ 成对符号走 punctuator 的 pair（交替配对）：滑一次出「（」，写完内容再滑一次出「）」。
  #   为什么不用 text: "（）{Left}"：那是前端直接插文本，有联想词时会把首候选顶上屏。
  # left: { icon: "arrow_left.svg", label: "⤆", send: Left }
  # right: { icon: "arrow_right.svg", label: "⤇", send: Right }
  # confirm: { send: Return, label: "确认", name: confirm }
  # next: { label: "换行", commit: "\\n" }

  ### eisu_toggle 竖屏
  eisu_toggle_schema_default: { icon: "ch_en.svg", label: "ABC", send: Eisu_toggle, select: .default, option: schema }
  eisu_toggle_123_number: { icon: "number.svg", label: "123", send: Eisu_toggle, select: number }
  eisu_toggle_ABC_english: { icon: "ch_en.svg", label: "中/英", send: Eisu_toggle, select: english}
  eisu_toggle_更多_dotSymbols: { icon: "symbols.svg", label: "更多", send: Eisu_toggle, select: .symbols }
  eisu_toggle_返回_default: { icon: "return_left_up.svg", label: 返回, send: Eisu_toggle, select: default }
  eisu_toggle_en_zh_default_schema_default: { icon: "en_ch.svg", label: "英/中", text: "{eisu_toggle_返回_default}{eisu_toggle_schema_default}" }
  eisu_toggle_符_symbols: { icon: "symbols.svg", label: "符", send: Eisu_toggle, select: symbols }
  eisu_toggle_default: { icon: "ch_en.svg", send: Eisu_toggle, select: default }
  eisu_toggle_status_bar_board: { icon: "switch_panel.svg", label: "状态栏", send: Eisu_toggle, select: _status_bar_board }
  # 手写键盘：切到下方 handwriting 布局（画板），点手写板底栏「写拼」切回 default，布局级可逆
  eisu_toggle_handwriting: { icon: "hand_draw.svg", label: "手写", send: Eisu_toggle, select: handwriting }
  ### eisu_toggle 横屏
  eisu_toggle_schema_default_land: { icon: "ch_en.svg", label: "ABC", send: Eisu_toggle, select: .default, option: schema }
  eisu_toggle_123_number_land: { icon: "number.svg", label: "123", send: Eisu_toggle, select: number_land }
  eisu_toggle_ABC_english_land: { icon: "ch_en.svg", label: "中/英", send: Eisu_toggle, select: english_land }
  eisu_toggle_返回_default_land: { icon: "return_left_up.svg", label: 返回, send: Eisu_toggle, select: default_land }
  eisu_toggle_en_zh_default_schema_default_land: { icon: "en_ch.svg", label: "英/中", text: "{eisu_toggle_返回_default_land}{eisu_toggle_schema_default_land}" }
  eisu_toggle_符_symbols_land: { icon: "symbols.svg", label: "符", send: Eisu_toggle, select: symbols_land }
  eisu_toggle_ABC_english_schema_easy_en_land: { icon: "keyboard_badge_globe.svg", label: "中/英", text: "{eisu_toggle_ABC_english_land}{eisu_toggle_schema_en}" }
  # 横屏手写键盘：select 字面指向 handwriting_land（横屏上滑直接进横屏手写，不依赖横屏映射）
  eisu_toggle_handwriting_land: { icon: "hand_draw.svg", label: "手写", send: Eisu_toggle, select: handwriting_land }
  ### text
  text_full_square_bracket_left: { label: "［］", text: "［］{Left}" }
  text_fullbracket_right_default_no_functional: { label: ")", text: "）{eisu_toggle_default}", functional: false }
  text_halfand_default_no_functional: { label: "&", text: "&{eisu_toggle_default}", functional: false }
  text_half_question_mark_default_no_functional: { label: "?", text: "?{eisu_toggle_default}", functional: false }
  text_half_point_default_no_functional: { label: "!", text: "!{eisu_toggle_default}", functional: false }
  text_half_comma_default_no_functional: { label: ",", text: ",{eisu_toggle_default}", functional: false }
  text_half_period_default_no_functional: { label: ".", text: ".{eisu_toggle_default}", functional: false }

  # 圆圈数字定义
  text_full_circled_1_default_no_functional: { label: "①", text: "①{eisu_toggle_default}", functional: false }
  text_full_circled_2_default_no_functional: { label: "②", text: "②{eisu_toggle_default}", functional: false }
  text_full_circled_3_default_no_functional: { label: "③", text: "③{eisu_toggle_default}", functional: false }
  text_full_circled_4_default_no_functional: { label: "④", text: "④{eisu_toggle_default}", functional: false }
  text_full_circled_5_default_no_functional: { label: "⑤", text: "⑤{eisu_toggle_default}", functional: false }
  text_full_circled_6_default_no_functional: { label: "⑥", text: "⑥{eisu_toggle_default}", functional: false }
  text_full_circled_7_default_no_functional: { label: "⑦", text: "⑦{eisu_toggle_default}", functional: false }
  text_full_circled_8_default_no_functional: { label: "⑧", text: "⑧{eisu_toggle_default}", functional: false }
  text_full_circled_9_default_no_functional: { label: "⑨", text: "⑨{eisu_toggle_default}", functional: false }
  text_full_circled_10_default_no_functional: { label: "⑩", text: "⑩{eisu_toggle_default}", functional: false }

  # 货币名称定义
  text_yuan_default: { label: "¥", text: "¥{eisu_toggle_default}", functional: false }
  text_dollar_default: { label: "$", text: "${eisu_toggle_default}" }
  text_euro_default: { label: "€", text: "€{eisu_toggle_default}" }
  text_pound_default: { label: "£", text: "£{eisu_toggle_default}" }
  text_ghanacedi_default: { label: "¢", text: "¢{eisu_toggle_default}" }
  text_baht_default: { label: "฿", text: "฿{eisu_toggle_default}" }
  text_rupee_default: { label: "₹", text: "₹{eisu_toggle_default}" }
  text_peso_default: { label: "₱", text: "₱{eisu_toggle_default}" }

  # 标点符号定义
  commit_fulldot: { label: "  。", commit: "。" }
  commit_bjgth: { label: "!", text: "{function_rime_clear}!" }   # 半角叹号：清候选直接上屏
  commit_dash: { label: "—", commit: "——" }
  commit_asterisk: { label: "*", commit: "*" }
  commit_percent: { label: "%", text: "{function_rime_clear}%" }   # 半角百分号：清候选直接上屏
  commit_halfcolon: { label: ":", text: "{function_rime_clear}:" }   # 半角冒号：清候选直接上屏
  commit_halfsemicolon: { label: ";", text: "{function_rime_clear};" }   # 半角分号：清候选直接上屏
  # —— 半角独立标点（本地覆盖预设同名 commit_*，仅保留供句号键 swipe_up 复用）——
  #   ⚠ preset_keys/default.yaml 里已有 commit_halfunderline / commit_half_tilde /
  #     commit_half_questionmark 的同名定义，主题内同名覆盖在真机上不生效（回落预设值）。
  #     故 26 键下滑一律改用下方 preset 中不存在同名的新动作 half_*_clear；
  #     这 3 条保持上一轮原样，不影响句号键 swipe_up 的既有行为。
  commit_halfunderline: { label: "_", text: "{function_rime_clear}_" }
  commit_half_tilde: { label: "~", text: "{function_rime_clear}~" }
  commit_half_questionmark: { label: "?", text: "{function_rime_clear}?" }
  # —— 26 键下滑半角独立标点：清候选直接上屏（不顶字）——
  #   下方 half_equal_clear / half_at_clear / half_poundsign_clear / half_slash_clear /
  #   half_asterisk_clear / half_tilde_clear 现无引用，按约定保留备用；仍在用的只有 _ ? 两个。
  #   动作名必须避开 preset_keys 同名（本地同名覆盖真机不生效）。
  #   写法用 text: "{function_rime_clear}X"：前置 candidate.clear 清掉未上屏编码，再前端直插
  #   半角字符；前端直插不经 Rime ProcessKey ⇒ 绕开 pair_punct.lua 的字符规则表，
  #   不进 punctuator、不弹候选、不顶字。与已验证正常的 ; : ! % 同一范式。
  half_equal_clear:      { label: "=", text: "{function_rime_clear}=" }
  half_underline_clear:  { label: "_", text: "{function_rime_clear}_" }
  half_tilde_clear:      { label: "~", text: "{function_rime_clear}~" }
  half_asterisk_clear:   { label: "*", text: "{function_rime_clear}*" }
  half_poundsign_clear:  { label: "#", text: "{function_rime_clear}#" }
  half_at_clear:         { label: "@", text: "{function_rime_clear}@" }
  half_question_clear:   { label: "?", text: "{function_rime_clear}?" }
  # —— 备用：Z 下滑 `/` 的清候选直插顿号方案，当前未引用（Z 下滑走 send_halfslash 按键通道）——
  half_slash_clear:       { label: "、", text: "{function_rime_clear}、" }



  # ★ 下滑（半角成对标点）= 清候选直接上屏：前置 {function_rime_clear} 先清掉未上屏候选/联想，再 text 直插一对 + 光标居中（避免把首候选顶上屏）
  down_halfbracket: { label: "(", text: "{function_rime_clear}(){Left}" }   # 半角括号对（H 下滑）：清候选直接上屏 + 光标居中
  # ★ 2026-09-29：26 键主键盘 / 符号页 N、M 的「上滑」改英文半角 , .
  #   半角 , . 走不了按键通道（punctuator 一定会把 , -> ，、. -> 。），只能用直插；
  #   而直插是前端插文本、不过 Rime ProcessKey ⇒ 必须前置 {function_rime_clear}，
  #   否则联想首候选会被一并顶上屏（原因见上面 §中文标点 的注释）。
  # 旧版（下滑直插单侧引号），保留备查
  # ★ G/H/K/L 上滑成对标点：text 直插一对 + {Left} 光标居中 = 顶字上屏（有未上屏候选/联想时先顶上屏再插括号）；不再前置 {function_rime_clear}
  #   + {Left} 光标停在一对符号中间；顶字上屏由 text 直插自然触发（与 send_* 行为一致，但保留光标居中）。
  pair_fullquote: { label: "“”", text: "“”{Left}" }   # 中文双引号一对 "" + 光标居中
  pair_halfquote: { label: "‘’", text: "‘’{Left}" }   # 中文单引号一对 '' + 光标居中
  pair_bracket: { label: "（）", text: "（）{Left}" }  # 中文括号一对 （） + 光标居中
  pair_booktitle: { label: "《》", text: "《》{Left}" }  # 书名号一对 《》 + 光标居中（H 上滑）
  # ★ K/L 下滑（英文引号对，清候选直接上屏）：半角 ASCII 引号/单引号一对 + 光标居中（前置 {function_rime_clear}，不顶候选）
  down_halfquotationmark: { label: "\"\"", text: "{function_rime_clear}\"\"{Left}" }   # 英文双引号一对 "" + 光标居中（清候选直接上屏）
  down_halfsemiquotationmark: { label: "''", text: "{function_rime_clear}''{Left}" }   # 英文单引号一对 '' + 光标居中（清候选直接上屏）
  down_angledbracket: { label: "<>", text: "{function_rime_clear}<>{Left}" }   # 英文尖括号一对 <> + 光标居中（清候选直接上屏，H 下滑）


preset_keyboards:
  __include: ./../public/preset_keyboards/default:/preset_keyboards
  default:
    name: default
    ascii_mode: 0
    height: 46
    width: 10
    horizontal_gap: 6                    # 按键之间的水平间距（单位：dp）
    vertical_gap: 7                      # 按键之间的垂直间距（单位：dp，竖屏有效）
    vertical_gap_land: 4
    round_corner: 6
    key_text_offset_x: 0
    key_text_offset_y: 0                 #键文本y轴偏移4
    key_upper_text_offset_x: 0
    key_upper_text_offset_y: 1           #上标符号文本y轴1、2、3、下偏移
    key_down_text_offset_x: 0
    key_down_text_offset_y: 1            #下标符号文本y轴-1、-2、-3上偏移
  # 默认菜单 - 显示在输入法底部的快捷工具栏
    menu: { events: [
     eisu_toggle_emoji,                               # 表情
     eisu_toggle_clip_board,                          # 打开剪切板
     eisu_toggle_common_setting_switches,             # 通用开关宫格
     eisu_toggle_status_bar_board,                    # 方案内置状态开关切换
     eisu_toggle_schema_board                         # 键盘方案选择
    ] }
    keys:
  ### 第1行
      - { click: q, label: Q, swipe_up: cnnum_1, swipe_down: 1, long_click: [commit_q,  1,  Q,  一] }
      - { click: w, label: W, swipe_up: cnnum_2, swipe_down: 2, long_click: [commit_w,  2,  W,  二] }
      - { click: e, label: E, swipe_up: cnnum_3, swipe_down: 3, long_click: [commit_e,  3,  E,  三] }
      - { click: r, label: R, swipe_up: cnnum_4, swipe_down: 4, long_click: [commit_r,  4,  R,  四] }
      - { click: t, label: T, swipe_up: cnnum_5, swipe_down: 5, long_click: [commit_t,  5,  T,  五] }
      - { click: y, label: Y, swipe_up: cnnum_6, swipe_down: 6, long_click: [commit_y,  6,  Y,  六] }
      - { click: u, label: U, swipe_up: cnnum_7, swipe_down: 7, long_click: [commit_u,  7,  U,  七] }
      - { click: i, label: I, swipe_up: cnnum_8, swipe_down: 8, long_click: [commit_i,  8,  I,  八] }
      - { click: o, label: O, swipe_up: cnnum_9, swipe_down: 9, long_click: [commit_o,  9,  O,  九] }
      - { click: p, label: P, swipe_up: cnnum_0, swipe_down: 0, long_click: [commit_p,  0,  P,  〇] }
  ### 第2行
