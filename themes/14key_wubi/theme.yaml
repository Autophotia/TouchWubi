    ascii_mode: 0
    height: 46
    width: 10
    height_land: 34
    horizontal_gap: 4                    # 按键之间的水平间距（单位：dp）
    vertical_gap: 7                      # 按键之间的垂直间距（单位：dp，竖屏有效）
    vertical_gap_land: 4
    round_corner: 6
    key_text_size: 21
