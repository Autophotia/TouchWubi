     eisu_toggle_clear_setting,                     # 清除文本相关操作
     eisu_toggle_更多_dotSymbols,                   # 更多符号
     eisu_toggle_schema_board,                      # 键盘方案选择
     eisu_toggle_status_bar_board                         # 方案内置状态开关切换
    ] }
    keys:
  ### 第1行
      - { click: q, width: 13, label: Q    W, long_click: [commit_Q, commit_q, commit_1, commit_w, commit_W], swipe_left: q, swipe_right: w, swipe_down: 1, swipe_up: function_keyboard_cut }
      - { click: e, width: 13, label: E    R, long_click: [commit_E, commit_e, commit_2, commit_r, commit_R], swipe_left: e, swipe_right: r, swipe_down: 2, swipe_up: function_keyboard_copy }
