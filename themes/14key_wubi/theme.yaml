# default settings
# encoding: utf-8

style:
  __include: ./../public/style/default:/style
  default:
    keyboards_land: [ default_land, english_land, number_land, symbols_land ] #横屏
  hmos:
    keyboards_land: [ default_land, english_land, number_land, symbols_land ] #横屏
preset_styles:
  __include: ./../public/preset_styles/default:/preset_styles
  __patch:
    light_land/+:
      keyboards: [ default_land, english_land, number_land, symbols_land ] #横屏
    dark_land/+:
      keyboards: [ default_land, english_land, number_land, symbols_land ] #横屏
preset_candidates:
  __include: ./../public/preset_candidates/default:/preset_candidates
  default:
    margin: 3                           #候选项外边距5
    padding: 3                          #候选项内边距5
    spacing: 5                          #候选间距8
    candidate_view_height: 48           #候选区高度51
preset_fonts:
  __include: ./../public/preset_fonts/default:/preset_fonts
  default:
    candidate_text_size: 18             # 候选字号22
    comment_text_size: 12               # 逐码提示字号12
    key_text_size: 21                   # 键字号18
    key_upper_text_size: 10             # 符号字号8
preset_menu:
  __include: ./../public/preset_menu/default:/preset_menu
preset_color_schemes:
  __include: ./../public/preset_color_schemes/default:/preset_color_schemes
preset_keys:
  __include: ./../public/preset_keys/default:/preset_keys

  ### send
  send_percent: { label: "%", send: "%" }
  send_fenhao: { label: ";", send: ";" }
  send_halfcomma: { label: " ， ", send: "," }
  send_comma: { label: ",", send: "," }
  send_dot: { icon: "textformat.svg", label: ".", send: "." }
  send_dot2: { label: " 。 ", send: "." }
  send_halfbracketL: { label: "(", send: "(" }
  send_halfbracketR: { label: ")", send: ")" }
  send_halfsquarebracketL: { label: "[", send: "[" }
  send_halfsquarebracketR: { label: "]", send: "]" }
  send_plus: { label: "+", send: "+" }
  send_minus: { label: "-", send: "-" }
  send_grave: { label: "`", send: grave }
  send_times: { label: "×", send: "*" }
  send_devided: { label: "÷", send: "/" }
  send_caret: { label: "^", send: "^" }

  ### 「清空」要忽略候选栏，一次清空到底
  #   keyboard.clearAll 在有 composition（联想段占位符 ›）时**只先清掉候选栏**，
  #   要再按一次才清正文 ⇒ 前置一次 {function_rime_clear}（candidate.clear，
  #   = 退格上滑「重输」，真机证实它连 Rime 侧 composition 一起清）。
  clear_all_assoc: { icon: "clean.svg", label: "清空", text: "{function_rime_clear}{function_keyboard_clearAll}" }

  ### 中文标点 —— ★ 必须走「发按键」，不能直接用 text/commit
  #  原因：text_ / commit_ / 全角字面量这几种写法是**前端直接往编辑器插文本**，
  #  不经过 Rime 的 ProcessKey ⇒ 我们的 smart_assoc processor 拦不到 ⇒
  #  联想词会被前端当成 composition 首候选一并顶上屏（如「测试沁？」）。
  #  改成 send 半角按键后：按键 → punctuator 查 symbols.yaml 转全角 → 上屏，
  #  而 smart_assoc 排在 punctuator 之前，能先把联想清掉。
  #  实测（沙箱）：联想态按 ? : ; ! 均只上屏全角标点、候选栏清空。
  send_question: { label: "？", send: "?" }        # punctuator: '?' -> ？
  send_colon: { label: "：", send: ":" }           # punctuator: ':' -> ：
  send_exclamation: { label: "！", send: "!" }     # punctuator: '!' -> ！
  send_semicolon: { label: "；", send: ";" }       # punctuator: ';' -> ；
  send_fullquote: { label: "“", send: "\"" }       # pair 交替：第1次 ‘ 开，第2次 ’ 闭
  send_fullcomma: { label: "，", send: "," }       # punctuator: ',' -> ，
  send_fullperiod: { label: "。", send: "." }      # punctuator: '.' -> 。
  # ★ 成对符号走 punctuator 的 pair（交替配对）：滑一次出「（」，写完内容再滑一次出「）」。
  #   为什么不用 text: "（）{Left}"：那是前端直接插文本，有联想词时会把首候选顶上屏。
  #   为什么不用 commit: "（）"：Rime 的 commit 不解析 {Left}，一次出两个但光标在末尾，更难用。
  send_bracket: { label: "（", send: "(" }          # pair 交替：第1次 （ ，第2次 ）
  send_chineseguillemet: { label: "《", send: "<" } # pair 交替：第1次 《 ，第2次 》
  ### ★ 成对符号改成「一次出一对 + 光标居中」
  #   上面那三个 send_ 走的是 punctuator 的 pair ⇒ **左右交替**（第1次出开的、
  #   第2次出闭的），手机上要多滑一次、还容易跟丢。现在按用户要求改成一下出一对。
  #   写法与 26 键下滑 `down_halfbracket` 完全同一范式：
  #     text: "{function_rime_clear}（）{Left}"
  #     └ 前置 candidate.clear：把联想段 / Rime composition 先清掉 ⇒ 不会顶候选上屏
  #     └ {Left} 是前端光标左移指令 ⇒ 光标正好停在一对符号中间
  #   ⚠ 代价（与 26 键下滑相同）：打字中有**未上屏编码**时按它会先把编码清掉。
  #     想要「左右交替」的老行为，把引用换回 send_fullquote / send_bracket /
  #     send_chineseguillemet 即可（定义都还在上面）。
  pair_fullquote: { label: "“”", text: "{function_rime_clear}“”{Left}" }
  pair_bracket: { label: "（）", text: "{function_rime_clear}（）{Left}" }
  pair_guillemet: { label: "《》", text: "{function_rime_clear}《》{Left}" }

  # left: { icon: "arrow_left.svg", label: "⤆", send: Left }
  # right: { icon: "arrow_right.svg", label: "⤇", send: Right }
  # confirm: { send: Return, label: "确认", name: confirm }
  # next: { label: "换行", commit: "\\n" }

  ### eisu_toggle 竖屏
  eisu_toggle_schema_default: { icon: "ch_en.svg", label: "ABC", send: Eisu_toggle, select: .default, option: schema }
  eisu_toggle_123_number: { icon: "number.svg", label: "123", send: Eisu_toggle, select: number }
  eisu_toggle_ABC_english: { icon: "ch_en.svg", label: "中/英", send: Eisu_toggle, select: english}
  eisu_toggle_更多_dotSymbols: { icon: "symbols.svg", label: "更多", send: Eisu_toggle, select: .symbols }
  eisu_toggle_返回_default: { icon: "return_left_up.svg", label: 返回, send: Eisu_toggle, select: default }
  eisu_toggle_en_zh_default_schema_default: { icon: "en_ch.svg", label: "英/中", text: "{eisu_toggle_返回_default}{eisu_toggle_schema_default}" }
  eisu_toggle_符_symbols: { icon: "symbols.svg", label: "符", send: Eisu_toggle, select: symbols }
  eisu_toggle_default: { icon: "ch_en.svg", send: Eisu_toggle, select: default }
  eisu_toggle_status_bar_board: { icon: "switch_panel.svg", label: "状态栏", send: Eisu_toggle, select: _status_bar_board }
  ### eisu_toggle 横屏
  eisu_toggle_schema_default_land: { icon: "ch_en.svg", label: "ABC", send: Eisu_toggle, select: .default, option: schema }
  eisu_toggle_123_number_land: { icon: "number.svg", label: "123", send: Eisu_toggle, select: number_land }
  eisu_toggle_ABC_english_land: { icon: "ch_en.svg", label: "中/英", send: Eisu_toggle, select: english_land }
  eisu_toggle_更多_dotSymbols_land: { icon: "symbols.svg", label: "更多", send: Eisu_toggle, select: .symbols }
  eisu_toggle_返回_default_land: { icon: "return_left_up.svg", label: 返回, send: Eisu_toggle, select: default_land }
  eisu_toggle_en_zh_default_schema_default_land: { icon: "en_ch.svg", label: "英/中", text: "{eisu_toggle_返回_default_land}{eisu_toggle_schema_default_land}" }
  eisu_toggle_符_symbols_land: { icon: "symbols.svg", label: "符", send: Eisu_toggle, select: symbols_land }
  eisu_toggle_default_land: { icon: "ch_en.svg", send: Eisu_toggle, select: default_land }
  eisu_toggle_ABC_english_schema_easy_en_land: { icon: "keyboard_badge_globe.svg", label: "中/英", text: "{eisu_toggle_ABC_english_land}{eisu_toggle_schema_en}" }
  ### text
  text_halfbracket: { label: "（）", text: "(){Left}" } #先上屏()然后光标往左移动一格
  text_halfguillemet: { label: "<>", text: "<>{Left}" }
  text_halfquotationmark: { label: "\"\"", text: "\"\"{Left}" }
  text_halfsemiquotationmark: { label: "''", text: "''{Left}" }
  text_halfsquarebracketleft: { label: "［］", text: "［］{Left}" }
  text_halfbrace: { label: "｛｝", text: "{}{Left}" }
  text_fullbracket: { label: "（）", text: "（）{Left}" } #先上屏()然后光标往左移动一格
  text_fullchineseguillemet: { label: "《》", text: "《》{Left}" }
  text_fullquotationmark: { label: "“”", text: "“”{Left}" }
  text_fullsemiquotationmark: { label: "‘’", text: "‘’{Left}" }
  text_fullcornerquotes: { label: "「」", text: "「」{Left}" }
  text_fulldoublequote: { label: "『』", text: "『』{Left}" }
  text_full_square_bracket_left: { label: "［］", text: "［］{Left}" }
  text_fullsquarebracketleft2: { label: "［］", text: "［］{Left}" }
  text_fullsquarebracketleft: { label: "【】", text: "【】{Left}" }
  text_fullbrace: { label: "｛｝", text: "{}{Left}" }
  text_fullbracket_right_default_no_functional: { label: ")", text: "）{eisu_toggle_default}", functional: false }
  text_halfand_default_no_functional: { label: "&", text: "&{eisu_toggle_default}", functional: false }
  text_half_question_mark_default_no_functional: { label: "?", text: "?{eisu_toggle_default}", functional: false }
  text_half_point_default_no_functional: { label: "!", text: "!{eisu_toggle_default}", functional: false }
  text_half_comma_default_no_functional: { label: ",", text: ",{eisu_toggle_default}", functional: false }
  text_half_period_default_no_functional: { label: ".", text: ".{eisu_toggle_default}", functional: false }

  # 圆圈数字定义
  text_full_circled_1_default_no_functional: { label: "①", text: "①{eisu_toggle_default}", functional: false }
  text_full_circled_2_default_no_functional: { label: "②", text: "②{eisu_toggle_default}", functional: false }
  text_full_circled_3_default_no_functional: { label: "③", text: "③{eisu_toggle_default}", functional: false }
  text_full_circled_4_default_no_functional: { label: "④", text: "④{eisu_toggle_default}", functional: false }
  text_full_circled_5_default_no_functional: { label: "⑤", text: "⑤{eisu_toggle_default}", functional: false }
  text_full_circled_6_default_no_functional: { label: "⑥", text: "⑥{eisu_toggle_default}", functional: false }
  text_full_circled_7_default_no_functional: { label: "⑦", text: "⑦{eisu_toggle_default}", functional: false }
  text_full_circled_8_default_no_functional: { label: "⑧", text: "⑧{eisu_toggle_default}", functional: false }
  text_full_circled_9_default_no_functional: { label: "⑨", text: "⑨{eisu_toggle_default}", functional: false }
  text_full_circled_10_default_no_functional: { label: "⑩", text: "⑩{eisu_toggle_default}", functional: false }

  # 货币名称定义
  text_yuan_default: { label: "¥", text: "¥{eisu_toggle_default}", functional: false }
  text_dollar_default: { label: "$", text: "${eisu_toggle_default}" }
  text_euro_default: { label: "€", text: "€{eisu_toggle_default}" }
  text_pound_default: { label: "£", text: "£{eisu_toggle_default}" }
  text_ghanacedi_default: { label: "¢", text: "¢{eisu_toggle_default}" }
  text_baht_default: { label: "฿", text: "฿{eisu_toggle_default}" }
  text_rupee_default: { label: "₹", text: "₹{eisu_toggle_default}" }
  text_peso_default: { label: "₱", text: "₱{eisu_toggle_default}" }

  # 标点符号定义
  commit_fulldot: { label: "  。", commit: "。" }
  send_fulldot: { label: "。", send: "。" }
  commit_bjgth: { label: "!", commit: "!" }
  commit_halfquestionmark: { label: "?", commit: "?" }
  commit_halfcomma: { label: ",", commit: "," }
  commit_halfquoteL: { label: "“", commit: "“" }
  commit_halfquoteR: { label: "”", commit: "”" }
  commit_backquote: { label: "`", commit: "`" }
  commit_halfcaret: { label: "^", commit: "^" }
  text_caret: { label: "^", text: "^" }
