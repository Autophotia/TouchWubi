    key_down_text_size: 8
    key_down_text_offset_y: 0            #下标符号文本y轴-1、-2、-3上偏移
  # 默认菜单 - 显示在输入法底部的快捷工具栏
    menu: { events: [
     eisu_toggle_emoji,                             # 表情
     eisu_toggle_custom_phrase_board,               # 常用语
     eisu_toggle_clip_board,                        # 打开剪切板
     eisu_toggle_cut_setting,                       # 剪切操作
