  commit_halfplus: { label: "+", commit: "+" }
  commit_asterisk: { label: "*", commit: "*" }
  commit_dunhao: { label: "、", commit: "、" }
  commit_solidus: { label: "/", commit: "/" }
  commit_equal: { label: "=", commit: "=" }
  commit_ellipsis: { label: "…", commit: "……" }
