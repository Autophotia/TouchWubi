preset_keyboards:
  __include: ./../public/preset_keyboards/default:/preset_keyboards
  default:
    name: default
    ascii_mode: 0
    height: 46
    width: 10
    height_land: 34
    horizontal_gap: 6                    # 按键之间的水平间距（单位：dp）
    vertical_gap: 7                      # 按键之间的垂直间距（单位：dp，竖屏有效）
    vertical_gap_land: 4
    round_corner: 6
    key_text_size: 21
    key_text_offset_x: 0
    key_text_offset_y: 0                 #键文本y轴偏移4
    key_upper_text_size: 9
    key_upper_text_offset_x: 0
    key_upper_text_offset_y: 1           #上标符号文本y轴1、2、3、下偏移
    key_down_text_size: 8
    key_down_text_offset_x: 0
    key_down_text_offset_y: 1            #下标符号文本y轴-1、-2、-3上偏移
  # 默认菜单 - 显示在输入法底部的快捷工具栏
    menu: { events: [
     eisu_toggle_emoji,                             # 表情
     eisu_toggle_clip_board,                        # 打开剪切板
     eisu_toggle_schema_board,                      # 键盘方案选择
     eisu_toggle_status_bar_board                         # 方案内置状态开关切换
    ] }
    keys:
  ### 第1行
      - { click: q, width: 20, label: Q   W, long_click: [commit_Q, commit_q, commit_1, commit_w, commit_W], swipe_left: q, swipe_right: w, swipe_down: 1, swipe_up: function_keyboard_cut }
      - { click: e, width: 20, label: E   R, long_click: [commit_E, commit_e, commit_2, commit_r, commit_R], swipe_left: e, swipe_right: r, swipe_down: 2, swipe_up: function_keyboard_copy }
      - { click: t, width: 20, label: T   Y, long_click: [commit_T, commit_t, commit_3, commit_y, commit_Y], swipe_left: t, swipe_right: y, swipe_down: 3, swipe_up: function_keyboard_paste }
      - { click: u, width: 20, label: U   I, long_click: [commit_U, commit_u, commit_4, commit_i, commit_I], swipe_left: u, swipe_right: i, swipe_down: 4, swipe_up: function_keyboard_selectAll }
      - { click: o, width: 20, label: O   P, long_click: [commit_O, commit_o, commit_5, commit_p, commit_P], swipe_left: o, swipe_right: p, swipe_down: 5, swipe_up: clear_all_assoc }
  ### 第2行
      - { click: a, width: 20, label: A   S, long_click: [commit_A, commit_a, commit_6, commit_s, commit_S], swipe_left: a, swipe_right: s, swipe_down: 6, swipe_up: "=" }
      - { click: d, width: 20, label: D   F, long_click: [commit_D, commit_d, commit_7, commit_f, commit_F], swipe_left: d, swipe_right: f, swipe_down: 7, swipe_up: "@" }
      - { click: g, width: 20, label: G   H, long_click: [commit_G, commit_g, commit_8, commit_h, commit_H], swipe_left: g, swipe_right: h, swipe_down: 8, swipe_up: "#" }
      - { click: j, width: 20, label: J   K, long_click: [commit_J, commit_j, commit_9, commit_k, commit_K], swipe_left: j, swipe_right: k, swipe_down: 9, swipe_up: pair_fullquote }
      # ★ pair_bracket：一次出一对（）+ 光标居中（text 直插 + function_rime_clear，不顶候选；
      #   机制见本文件上部定义段）。竖屏 L 上滑 = （）；横屏 L 上滑 = 《》（横竖屏有意不同，README 已文档化）。
      - { click: l, width: 20, label: L, long_click: [commit_l, commit_0, commit_L], swipe_down: 0, swipe_up: pair_bracket }
  ### 第3行
      - { click: shift, width: 10, has_menu: text_delimiter, name: shift, preview: false }
      - { click: z, width: 10, label: Z, long_click: [commit_z, "`", commit_Z], swipe_down: "%", swipe_up: "/" }
      - { click: x, width: 20, label: X   C, long_click: [commit_X, commit_x, commit_c, commit_C], swipe_left: x, swipe_right: c, swipe_down: send_exclamation, swipe_up: "*" }
      - { click: v, width: 20, label: V   B, long_click: [commit_V, commit_v, commit_b, commit_B], swipe_left: v, swipe_right: b, swipe_down: send_question, swipe_up: send_colon }
      - { click: n, width: 20, label: N   M, long_click: [commit_N, commit_n, commit_m, commit_M], swipe_left: n, swipe_right: m, swipe_down: function_keyboard_redo, swipe_up: send_semicolon }
      - { click: backspace, width: 20, name: backspace, preview: false, swipe_down: function_keyboard_undo, swipe_up: function_rime_clear}
  ### 第4行
      - { click: eisu_toggle_符_symbols, width: 14, name: symbol, preview: false }
      - { click: eisu_toggle_123_number, width: 12, has_menu: text_halfperiod, name: number, preview: false }
      - { click: send_fullcomma, width: 10, long_click: commit_half_comma, swipe_up: "-", swipe_down: commit_half_comma }
      - { click: space, width: 28, name: space, preview: false }
      - { click: send_fullperiod, width: 10, long_click: commit_halfperiod, swipe_up: "+", swipe_down: commit_halfperiod }
      - { click: eisu_toggle_ABC_english_schema_easy_en, width: 12, has_menu: text_halfcomma, name: english, preview: false }
      - { click: return, width: 14, name: return, composing: confirm, long_click: [clear_all_assoc, function_keyboard_clearLeft, function_keyboard_clearRight,  function_keyboard_undo, function_keyboard_redo, next], rect_preview: true, preview: false}

