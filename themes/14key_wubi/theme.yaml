  commit_less: { label: "<", commit: "<" }
  commit_smhL: { label: "《", commit: "《" }
  commit_smhR: { label: "》", commit: "》" }
  commit_division: { label: "÷", commit: "÷" }
  commit_halfleftparen: { label: "(", commit: "(" }
  commit_halfrightparen: { label: ")", commit: ")" }
  commit_fullleftparen: { label: "（", commit: "（" }
