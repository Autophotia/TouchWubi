  commit_halfsemiquoteL: { label: "‘", commit: "‘" }
  commit_halfsemiquoteR: { label: "’", commit: "’" }
  commit_percent: { label: "%", commit: "%" }
  commit_halfcolon: { label: ":", commit: ":" }
